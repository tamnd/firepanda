# Channel names and package names for the Mojo toolchain have moved more than once
# during Mojo's pre-1.0 period. Verify these against the toolchain you actually
# install rather than against this file; see docs/specs/01-research-2026.md.
[workspace]
name = "firepanda"
version = "0.8.32"
description = "A dataframe library for Mojo with the pandas API"
authors = ["tamnd <tamnd87@gmail.com>"]
license = "Apache-2.0"
# The community channel is deliberately absent. Pixi resolves with strict channel
# priority, so a channel listed here outranks conda-forge for every package it
# happens to carry, and adding modular-community made the differential environment
# unsolvable with an error that pointed at pyarrow rather than at the channel list.
# Add it back the day we actually depend on something in it, not before.
channels = ["https://conda.modular.com/max", "conda-forge"]
# No osx-64. Modular stopped shipping a Mojo for Intel macOS, and the solver says
# so plainly: every `modular` release wants a `mojo` that has no candidate there.
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
modular = "*"

# The engine depends on almost nothing on purpose. The ecosystem is young and its
# most prominent HTTP library was archived in May 2026; anything we take on here is
# something we may end up maintaining.
[feature.dev.dependencies]
python = ">=3.12"
# Parquet is read by binding a library rather than by decoding pages ourselves,
# and the library is DuckDB rather than Arrow C++ because Arrow C++ exports no C
# symbols at all. See docs/specs/08-milestones.md on M2. It is here rather than
# in [dependencies] because firepanda loads it at run time and works without it:
# a build with no libduckdb reachable is a build where read_parquet raises and
# everything else is unaffected. Tests need it, so the development environment
# has it.
libduckdb = { version = ">=1.4", channel = "conda-forge" }

# The nightly channel is scoped to this feature rather than added to the workspace,
# so a default `pixi run` cannot quietly resolve the toolchain to a nightly build.
[feature.nightly]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]

[feature.nightly.dependencies]
modular = "*"

# Mojo imports pandas in the same process, so the conformance suite needs no
# bindings and works from M1. docs/specs/09-quality-bar.md section 4.
#
# The pyarrow floor is not a wish, it is what the toolchain already ships. The
# Modular stack pulls in pyarrow 24 and pins libprotobuf to 6, while libarrow 25
# wants libprotobuf 7, so asking for pyarrow 25 makes the environment unsolvable
# with an error that reads like conda-forge is missing builds. Match the toolchain
# and raise this when the toolchain raises it.
#
# Each of these names conda-forge explicitly. None of them lives in the Modular
# channel, so today the qualification changes nothing, but the Modular channel is
# listed first and strict priority means anything it starts shipping silently wins.
# Saying conda-forge out loud is how the day that happens stays uneventful.
[feature.differential.dependencies]
python = { version = ">=3.12", channel = "conda-forge" }
pandas = { version = ">=3.0", channel = "conda-forge" }
pyarrow = { version = ">=24", channel = "conda-forge" }
duckdb = { version = "*", channel = "conda-forge" }
polars = { version = ">=1.43", channel = "conda-forge" }
numpy = { version = ">=2", channel = "conda-forge" }
scipy = { version = ">=1.14", channel = "conda-forge" }

[environments]
default = { features = ["dev"], solve-group = "main" }
nightly = { features = ["nightly", "dev"] }
differential = { features = ["dev", "differential"] }

[tasks]
# `mojo package` and `mojo test` do not exist in Mojo 1.0. Packaging is
# `precompile` and the output extension is `.mojoc`; tests are ordinary programs
# that call `TestSuite.discover_tests`, so the runner is a loop.
# The mkdir is not decoration. `mojo precompile` will not create the directory
# its output path names, it fails with "No such file or directory", and a fresh
# checkout has no build/ because build/ is ignored.
#
# Nothing in this repository reads what it writes. The test runner compiles each
# file with `mojo run -I .` against the sources, `tools/build_extension.sh`
# builds the shared library with `-I "$root"`, and the differential builds have
# their own tasks. The package is a product for Mojo callers outside the
# repository rather than an input to anything inside it, and the comment in
# .github/workflows/ci.yml says why handing it to the test files would not help
# anyway: generics are instantiated into whichever program uses them, so
# `mojo run -I build` is slower than `mojo run -I .`, not faster.
#
# So `test` no longer depends on it. That dependency was costing between fifty
# seven and eighty nine seconds in every job of every run, which on the merge
# matrix is thirty jobs, and in the two shards that hold no expensive file it was
# longer than the tests it preceded: shard six spent eighty one seconds
# precompiling and sixty four running.
build = { cmd = "mkdir -p build && mojo precompile firepanda -o build/firepanda.mojoc", inputs = [
  "firepanda/**",
], outputs = ["build/firepanda.mojoc"] }
test = "bash tools/run_tests.sh"

# The same suite without the fifty one files that cost a minute or more. Those
# fifty one are seventy four per cent of the run, so this is two files in three
# for a quarter of the time, and it is meant for the loop somebody is in while
# they are writing code rather than for deciding whether a branch is good. The
# runner says which files it left out, so a green one here is never mistaken for
# a green `pixi run test`.
test-fast = "bash tools/run_tests.sh --fast"

# The same suite, one shard per remote host. The laptop these worktrees live on
# carries several projects at once and the suite is the first thing to feel it,
# so this hands the work to machines that are at least not also running the
# editor. It picks its hosts by what they are already carrying and says which
# ones it left out. See the header of `tools/run_tests_remote.sh`.
test-remote = "bash tools/run_tests_remote.sh"

# Only the test files that import something this branch touched. A test cannot
# break unless something it imports changed, and Mojo imports are static, so the
# set is readable straight off the source. Measured over all 199 library files,
# the median one selects sixteen per cent of the suite and the SQL front end
# files select twelve. The files everything imports select the lot, which is the
# right answer rather than a failure of the idea.
#
# Like `test-fast`, it is for the loop somebody is in while they are writing
# code, and it says so on the way in. Anything it cannot reason about, which is
# any change outside `firepanda/` and `tests/` and anything that is not a `.mojo`
# file, runs the whole suite. See the header of `tools/affected.py`.
test-changed = "bash tools/run_tests.sh --changed"

# The two together, which is the combination worth having: the selection is made
# here, where there is a `.git` to diff, and sent to the hosts as a list.
test-remote-changed = "bash tools/run_tests_remote.sh --changed"
format = "mojo format firepanda tests benchmarks tools"

# Regenerates `tools/test_costs.txt`, which is how the workflow's ten test
# shards know how to divide the files up. Run it when the shards have drifted
# apart, which is what adding or deleting a few test files eventually does. It
# is a whole unsharded test run, so it costs what a whole test run costs.
#
# `tools/test_costs_from_ci.sh <run-id>` is the better way when there is a CI
# run to read, and it is free. The ratios between files are not the same on a
# workstation as on a four core runner, so a table measured here balances the
# runner badly: one measured on sixteen cores put the shards within half a per
# cent of each other there and at 423 against 622 seconds on the runner.
test-costs = "FIREPANDA_TEST_WRITE_COSTS=tools/test_costs.txt bash tools/run_tests.sh"

# The CPython extension, and everything it needs, in one directory that points at
# nothing outside itself. Separate from `build` because it is a different output
# for a different consumer: `build` produces a .mojoc for Mojo callers, this
# produces a .so for CPython. docs/specs/12-the-python-front-door-measured.md
# section 2.
build-extension = "bash tools/build_extension.sh"

# Not `mojo format --check`. That flag does not exist in Mojo 1.0; the formatter
# only rewrites in place. tools/format_check.sh does the copy-format-diff dance.
format-check = "bash tools/format_check.sh"

# One of the two regular expression engines copies CPython's `re`, and `re` is
# not the same module in every version this project supports. The rules that
# moved are written down as version constants in the compiler, and the failure
# mode of a constant like that is quiet: nothing raises when the world moves
# past it. This is the thing that raises. It runs under the pixi interpreter
# rather than under uv's, because the pixi one is what the differential sweeps
# measure against and is therefore the one whose `re` is the oracle.
python-version = "python tools/python_version.py"

# The bitmap is checked against a `List[Bool]` reference written with no bit
# twiddling at all, every kernel is checked against its scalar twin in
# firepanda/kernel/scalar.mojo, factorize is checked against the quadratic one in
# firepanda/hash/scalar.mojo, and the join is checked against the nested loop in
# firepanda/join/scalar.mojo. The twins are never called in production and exist
# to be the specification.
# All four at once rather than one after another. They share nothing, and each
# spends its first seconds in the compiler, so in sequence this step waited for
# the sum of four compiles for no reason. `--max-total-time=N` still means N
# seconds per fuzzer.
fuzz = "bash tools/run_fuzz.sh"
fuzz-bitmap = "mojo run -I . tests/fuzz/main.mojo"
fuzz-kernel = "mojo run -I . tests/fuzz/kernel.mojo"
fuzz-hash = "mojo run -I . tests/fuzz/hash.mojo"
fuzz-join = "mojo run -I . tests/fuzz/join.mojo"

# The substitute for a race detector: every parallel operator, thousands of
# iterations, randomized worker counts and cancellation points, compared against
# the single-threaded result. docs/specs/09-quality-bar.md section 3.
stress = "mojo run -I . tests/stress/main.mojo"

# The differential programs are built first and then run, rather than run
# through `mojo run`. `mojo run` compiles into the process it then runs the
# program in, and the two do not always take each other's teardown well: the
# generated statement comparison aborted at exit with a glibc "corrupted
# double-linked list" three times in twenty five, every time after the
# comparison had finished and its whole report had printed, and the crash
# handler then held the dead process open until the job's ceiling killed it. The
# same program built and then run is clean over a hundred and twenty five runs.
# Building is not slower either, because `mojo run` compiles too, and this way
# the whole job pays for its compiles once at the start.
#
# `inputs` and `outputs` are what keep the steps below from compiling everything
# once per step. Each of them depends on this task, and without a cache key pixi
# would honour that literally.
#
# The builds themselves are in a script rather than in a chain of && here,
# because there are ten of them now and one after another took longer than the
# job is allowed. The script says what it does with them.
#
# Two groups rather than one, because the two jobs that run these want different
# halves and each was compiling all eleven to get six. The core group is what the
# pull request pipeline runs; the regex group is what the merge runs, out of the
# four specification documents that introduce them. Building both on every pull
# request was about half of the longest step left in that pipeline.
differential-build = { cmd = "bash tools/build_differential.sh core", default-environment = "differential", inputs = [
  "firepanda/**",
  "tests/differential/*.mojo",
], outputs = [
  "build/differential/frames",
  "build/differential/sql",
  "build/differential/generated",
  "build/differential/semantics",
  "build/differential/answers",
  "build/differential/tpch",
] }

differential-build-regex = { cmd = "bash tools/build_differential.sh regex", default-environment = "differential", inputs = [
  "firepanda/**",
  "tests/differential/*.mojo",
], outputs = [
  "build/differential/regex",
  "build/differential/regex-match",
  "build/differential/regex-count",
  "build/differential/regex-replace",
  "build/differential/regex-python",
  "build/differential/regex-re2",
  "build/differential/regex-property",
] }

differential = { cmd = "./build/differential/frames", default-environment = "differential", depends-on = ["differential-build"] }

# DuckDB's own test corpus, which is the oracle for the compatibility claim.
# `corpus` fetches test/sql at the commit the grammar is pinned to and flattens
# it into one statements file. It is not checked in, because 33 MB against a 5 MB
# repository is not a trade worth making for something only the harness reads.
# See docs/specs/sql/13-open-questions.md question 10.
corpus = { cmd = "bash tools/fetch_corpus.sh && python tools/corpus.py" }
differential-sql = { cmd = "./build/differential/sql", default-environment = "differential", depends-on = ["corpus", "differential-build"] }

# The question after the parser's. Both harnesses above ask whether a statement
# parses; this one asks what an expression's type comes out as, over columns of
# known types, which is what the binder decides and what a wrong answer with no
# error attached would come from. It needs no corpus either.
# See docs/specs/sql/11-conformance.md section 5.
differential-semantics = { cmd = "./build/differential/semantics", default-environment = "differential", depends-on = ["differential-build"] }

# And the question after that one. A type comparison cannot see a kernel that
# counts the right thing wrongly, which is how `strlen` shipped counting
# characters where DuckDB counts bytes with every test above it agreeing. This
# runs the same expressions over the same eight rows through both engines and
# compares the values. It needs no corpus.
# See docs/specs/sql/11-conformance.md section 6.
differential-answers = { cmd = "./build/differential/answers", default-environment = "differential", depends-on = ["differential-build"] }

# The same comparison against statements nobody wrote. The grammar writes them,
# which reaches the rules DuckDB's corpus happens to have no test for, and it
# needs no corpus so it is cheap to run anywhere.
# See docs/specs/sql/11-conformance.md section 4.
differential-sql-generated = { cmd = "./build/differential/generated", default-environment = "differential", depends-on = ["differential-build"] }

# The same idea one layer down, about regular expressions rather than SQL. pandas
# parses every pattern with Python's parser and routes the call to Python or to
# Arrow on what comes back, so the parse is the thing that decides which engine
# answers, and a front end that reads one pattern differently sends that pattern
# to the other engine. This builds patterns out of the grammar and compares both
# decisions against pandas' own predicate. It needs no corpus.
# See docs/specs/76-two-engines-and-the-parser-that-picks-one.md section 6.
differential-regex = { cmd = "./build/differential/regex", default-environment = "differential", depends-on = ["differential-build-regex"] }

# The question after that one. Routing agreement is one bit per pattern and says
# nothing about what the engine then answers, so this runs the same corpus
# against sixteen pieces of text through firepanda's own matching engine and
# through pandas' `str.contains`, and compares both the refusals and the
# answers. RE2 refuses a good deal of what Python reads, so the refusals are
# half the specification rather than a gap. It needs no corpus.
# See docs/specs/77-the-machine-that-runs-a-pattern-once.md section 7.
differential-regex-match = { cmd = "./build/differential/regex-match", default-environment = "differential", depends-on = ["differential-build-regex"] }

# And the question after that one, which is not the same question asked again.
# Whether a pattern matches is a bit and stops at the first match. How many
# times it matches is a loop, the loop belongs to Arrow rather than to either
# engine, and the three rules it follows are none of them what a reader would
# guess: the rest of the row becomes the text after every match, the scan moves
# in bytes, and a match of no width found ahead of the scan is counted where it
# was found and again from there. This runs the same corpus over the same
# sixteen texts through `str.count` on both sides and compares the numbers. It
# needs no corpus.
# See docs/specs/79-counting-is-not-asking-four-times.md section 7.
differential-regex-count = { cmd = "./build/differential/regex-count", default-environment = "differential", depends-on = ["differential-build-regex"] }

# And the question after that one, which is the first whose answer is text. A
# replacement runs a third loop, and it is not the loop that counts even though
# it lives in the same library and reads the same pattern: it does not cut the
# row, it moves in characters rather than bytes, and it copies a character
# across where the count simply steps. It is also the first thing here that asks
# the engine where each group matched rather than only whether the pattern
# ended, because a replacement can name a group. This runs the same corpus over
# the same sixteen texts with three replacements and compares the rows. It needs
# no corpus.
# See docs/specs/80-replacing-is-a-third-loop.md section 7.
differential-regex-replace = { cmd = "./build/differential/regex-replace", default-environment = "differential", depends-on = ["differential-build-regex"] }

# The same corpus asked of the other engine. Six of the accessor's nine pattern
# methods go to Arrow and get RE2's reading, and `extract`, `extractall` and
# `findall` never reach Arrow at all: pandas compiles the pattern with `re` and
# loops in Python. So `\\w` covers 63 characters for one half of the accessor
# and 138558 for the other, `\\d` is the ASCII ten or every decimal digit there
# is, and `$` matches before a final newline for one and not for the other. This
# runs the same corpus over the same sixteen texts through `str.findall` and
# compares the refusals and the answers. It needs no corpus.
# See docs/specs/81-the-same-letter-in-two-alphabets.md section 7.
differential-regex-python = { cmd = "./build/differential/regex-python", default-environment = "differential", depends-on = ["differential-build-regex"] }

# The question underneath all four of those, which is whether RE2 reads the
# pattern at all. For most of the corpus it is the only question there is: two
# patterns in three are ones Python's grammar cannot read, which is how they
# reach Arrow in pandas, and nine in ten of those are ones RE2 will not read
# either, so the whole of what a caller gets back is a refusal. This reads every
# pattern with RE2's grammar and compares the verdict and the reason against the
# RE2 Arrow is built with. Answering no to a pattern RE2 reads is a new wrong
# refusal and the ceiling for it is zero; answering yes to one RE2 refuses is
# the bias the reader is written with and is counted rather than failed. It
# needs no corpus.
# See docs/specs/101-a-second-grammar-that-only-says-no.md section 7.
differential-regex-re2 = { cmd = "./build/differential/regex-re2", default-environment = "differential", depends-on = ["differential-build-regex"] }

# The one comparison of the seven that compares data rather than a decision. The
# table that `\p{...}` is read against is 200 names and 5820 ranges, measured
# once against one release of pyarrow and carried in the repository ever since,
# and nothing checked it afterwards. A corpus pattern that names a category
# proves the name is found and says nothing about whether the ranges are RE2's,
# because a name is a set of a million code points and the corpus runs against a
# hundred texts. This asks RE2 about the four code points around each range,
# which is where a range table is wrong if it is wrong at all, so the check that
# is otherwise a full regeneration takes seconds.
# See docs/specs/116-the-edges-of-every-range.md section 2.
differential-regex-property = { cmd = "./build/differential/regex-property", default-environment = "differential", depends-on = ["differential-build-regex"] }

# The same comparison one size up. Everything above asks about an expression,
# and an expression comparison cannot reach a join order, a group, a sort or a
# limit. This asks whole TPC-H queries, over data DuckDB's own generator wrote
# out to Parquet so that both engines read the same bytes. The scale factor is
# `FIREPANDA_TPCH_SCALE` and defaults to 0.01, which is three megabytes and a
# few seconds; the S4 exit criterion is written at 1, which is a hundred times
# that and is a number to run by hand.
# See docs/specs/sql/11-conformance.md section 7.
tpch = { cmd = "./build/differential/tpch", default-environment = "differential", depends-on = ["differential-build"] }

bench = "mojo run -I . benchmarks/main.mojo"
bench-compare = "python tools/bench_compare.py"

# Under monomorphization these are the numbers most likely to blow up, so they are
# graphed from M0 rather than thresholded from M8. docs/specs/03-dtype-dispatch.md.
compile-budget = "python tools/compile_budget.py"

# DuckDB's PEG grammar, vendored verbatim, and the tables generated from it.
# `vendor-grammar` takes a tag or a branch and rewrites firepanda/sql/grammar/.
# `gen-grammar` turns that into firepanda/sql/generated/, which is checked in so
# that a contributor with no Python and no network can still build firepanda.
# `check-grammar` is the same run with the output compared rather than written,
# which is what stops somebody hand editing a table. docs/specs/sql/03-the-grammar.md.
vendor-grammar = "bash tools/vendor_grammar.sh"
gen-grammar = "python tools/gen_grammar.py"
check-grammar = "python tools/gen_grammar.py --check"

# The tier 1 function catalog, read off a live DuckDB rather than typed in.
# These two need the differential environment, because that is the one with
# DuckDB in it. docs/specs/sql/07-functions.md.
gen-functions = { cmd = "python tools/gen_functions.py", default-environment = "differential" }
check-functions = { cmd = "python tools/gen_functions.py --check", default-environment = "differential" }

# What an implicit cast costs, which is what decides between two overloads that
# both fit. DuckDB publishes no such table, so this one is solved out of the
# choices DuckDB makes over a couple of thousand calls, every one of them put
# to a live DuckDB. Same environment as the catalog and for the same reason.
# docs/specs/sql/07-functions.md.
gen-casts = { cmd = "python tools/gen_casts.py", default-environment = "differential" }
check-casts = { cmd = "python tools/gen_casts.py --check", default-environment = "differential" }

# The README's list of what the SQL front end refuses, written out of
# `sql_support()` rather than kept beside it. `--check` is the same run with the
# file compared rather than written. There is no CI step for it, because
# tests/test_sql_unsupported.mojo checks the same thing and the test suite
# already runs.
sql-support = "mojo run -I . tools/sql_support.mojo"
check-sql-support = "mojo run -I . tools/sql_support.mojo --check"

# A grep is not a sanitizer. It is what exists.
check-shared-state = """
! grep -rn --include=*.mojo -E '\\bAtomic\\b|^var [a-z_]+ *=' firepanda \
  --exclude-dir=exec || (echo 'shared state outside exec/shared.mojo' && exit 1)
"""
