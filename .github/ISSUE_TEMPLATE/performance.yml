name: Performance problem
description: Something is slower than it should be
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Performance is the entire premise of this project, so these are high-value
        reports. A measurement beats an impression: please include timings.

  - type: textarea
    id: what
    attributes:
      label: The operation
      render: python
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: Timings
      description: firepanda, and whatever you are comparing against. Row counts, dtypes, cardinality.
    validations:
      required: true

  - type: textarea
    id: explain
    attributes:
      label: Output of explain()
      description: For anything lazy, or anything eager after M4, since the eager surface builds plans too.
      render: text

  - type: input
    id: machine
    attributes:
      label: Machine
      placeholder: physical core count, RAM, and whether it was cold or warm cache
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: firepanda and Mojo toolchain versions
    validations:
      required: true
