name: Setup pixi
description: >
  Install pixi and materialize a locked environment. Installed from the official
  script rather than a third-party action so the pinned version is visible in this
  file and upgrading it is a one-line change with no action-version coupling.

inputs:
  environment:
    description: pixi environment to install
    required: false
    default: default
  pixi-version:
    description: pixi version to install, or "latest"
    required: false
    default: latest
  cache-slot:
    description: >
      Which compiler cache entry this job reads and writes. Jobs that compile
      different things want different entries, because one entry shared by all
      of them would be whichever job finished last and would carry the other
      jobs' artefacts around for nothing. The test job passes its shard number,
      so each shard keeps the cache for its own eighth of the files.
    required: false
    default: shared
  locked:
    description: >
      Install exactly what pixi.lock says. Set this to false for the nightly job,
      which exists to find out what today's toolchain does and would learn nothing
      from a toolchain pinned in a lockfile that was solved weeks ago.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Retried, because this is the first step of all thirteen jobs and it reaches
    # the network twice: once for the script and once for the release tarball the
    # script fetches. A single HTTP 504 from the release host failed three
    # unrelated jobs of one run and cost the whole pipeline a repeat, which on a
    # busy pool is a good twenty minutes. Three attempts with a growing pause,
    # because a 504 there clears in seconds and a real outage is not going to
    # clear at all, and the tries are cheap either way.
    - name: Install pixi
      shell: bash
      env:
        PIXI_VERSION: ${{ inputs.pixi-version }}
      run: |
        for attempt in 1 2 3; do
          if curl -fsSL https://pixi.sh/install.sh | bash; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "pixi did not install in three attempts" >&2
            exit 1
          fi
          echo "pixi install attempt $attempt failed, retrying" >&2
          sleep $((attempt * 10))
        done
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

    # Keyed on the lockfile: a dependency change busts the cache, nothing else does.
    - name: Cache environment
      uses: actions/cache@v6
      with:
        path: |
          .pixi
          ~/.cache/rattler
        key: pixi-${{ runner.os }}-${{ runner.arch }}-${{ inputs.environment }}-${{ hashFiles('pixi.lock') }}
        restore-keys: |
          pixi-${{ runner.os }}-${{ runner.arch }}-${{ inputs.environment }}-

    # Inputs come in through env rather than through ${{ }} inside the script.
    # An expression is expanded into the shell text before bash ever sees it, so
    # an input carrying a quote or a semicolon becomes shell syntax; an env var is
    # just data. zizmor flags the difference as template-injection and is right to.
    - name: Install environment
      shell: bash
      env:
        LOCKED: ${{ inputs.locked }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [ "$LOCKED" = "true" ]; then
          pixi install --locked --environment "$ENVIRONMENT"
        else
          pixi update --environment "$ENVIRONMENT"
          pixi install --environment "$ENVIRONMENT"
        fi

    # The compiler keeps its own record of what it has already built, under
    # `$MODULAR_HOME`, which pixi puts at `.pixi/envs/<environment>/share/max`.
    # Carrying it between runs is worth about nine times on a file the change
    # does not touch and about three on the file it does, measured on the
    # workstation against `tests/test_sql_run.mojo`:
    #
    #   cold cache                                        195 s
    #   warm cache, nothing changed                        22 s
    #   warm cache, after a real change to `run` itself     61 s
    #
    # All 422 tests pass in each of those, and the middle one is not the cache
    # answering from yesterday: putting a `raise` at the top of `run` turned the
    # warm run into 422 failures in 61 seconds, and reverting it went back to 422
    # passes in 22. The cache invalidates on what a change reaches rather than on
    # the file it was written in.
    #
    # `.pixi` is already cached by the step above, but keyed on `pixi.lock`, and
    # `actions/cache` only writes when its key missed. The lockfile almost never
    # moves, so that entry has been serving whatever was in this directory when
    # it last did, which is a `pixi install` with no compiles behind it. Hence a
    # separate entry, keyed so that it misses every time, restored by prefix.
    #
    # It sits here rather than in one job because every job that compiles Mojo
    # wants it, and the ones that do not are the ones that never populate it.
    #
    # Two steps because the merge should write the cache and a pull request
    # should not. `actions/cache` registers a save for the end of the job;
    # `actions/cache/restore` does not. So a pull request reads what the merge
    # left and uploads nothing, which keeps it off the clock of whoever is
    # waiting and out of the repository's ten gigabyte cache budget.
    - name: Compiler cache, read and write
      if: github.event_name == 'push'
      uses: actions/cache@v6
      with:
        path: .pixi/envs/${{ inputs.environment }}/share/max/cache/.mojo_cache
        key: mojo-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.environment }}-${{ inputs.cache-slot }}-${{ github.sha }}
        restore-keys: |
          mojo-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.environment }}-${{ inputs.cache-slot }}-

    - name: Compiler cache, read only
      if: github.event_name != 'push'
      uses: actions/cache/restore@v6
      with:
        path: .pixi/envs/${{ inputs.environment }}/share/max/cache/.mojo_cache
        key: mojo-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.environment }}-${{ inputs.cache-slot }}-${{ github.sha }}
        restore-keys: |
          mojo-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.environment }}-${{ inputs.cache-slot }}-

    # The Mojo ABI is not stable, so which toolchain compiled a result is part of
    # the result. Record it where every job's log can be read for it.
    - name: Record toolchain
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        pixi run --environment "$ENVIRONMENT" mojo --version | tee -a "$GITHUB_STEP_SUMMARY"
