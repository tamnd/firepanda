name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  provenance:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

  testpypi:
    name: Publish to TestPyPI
    needs: [build, provenance]
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/firepanda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Trusted Publishing: OIDC, no API token stored anywhere in this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: testpypi
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/firepanda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The toolchain version is part of the release identity: the Mojo ABI is
          # not stable, so a binary built against one runtime is not guaranteed to
          # load against another. docs/specs/09-quality-bar.md section 8.
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  # modular-community is a pull request against someone else's repository, so it is
  # slower than PyPI and is not gated on. The git install path stays documented.
  modular-community:
    name: Remind to publish to modular-community
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Publish ${GITHUB_REF_NAME} to modular-community" \
            --label "packaging,release" \
            --body "\`${GITHUB_REF_NAME}\` is on PyPI. Open the recipe pull request against \`modular/modular-community\` and link it here. Close when the package is resolvable via \`pixi add -c https://repo.prefix.dev/modular-community firepanda\`."
