name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  # Everything below this point has nothing to do until there are wheels, and
  # wheels wait for the Python front door at M3. Attesting the provenance of an
  # empty directory failed the release for 0.1.0 rather than being skipped, which
  # is a worse way to find out that a tag produced no artifacts than a skip is.
  provenance:
    name: Attest build provenance
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

  testpypi:
    name: Publish to TestPyPI
    needs: [build, provenance]
    if: needs.build.outputs.ready == 'true' && (github.event_name == 'push' || inputs.target == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/firepanda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Trusted Publishing: OIDC, no API token stored anywhere in this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: [build, testpypi]
    if: needs.build.outputs.ready == 'true' && (github.event_name == 'push' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/firepanda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # An index answers an upload with 429 when too many have gone out in too short
  # a time, and the tag is then published nowhere with nothing said about it.
  # This writes down that it happened and when the window opens again, and the
  # publish watch says so on the same issue once that time has passed.
  rate-limit:
    name: Note an index rate limit
    needs: [testpypi, pypi]
    if: always() && (needs.testpypi.result == 'failure' || needs.pypi.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the waiting issue
        env:
          GH_TOKEN: ${{ github.token }}
          # PyPI does not publish the length of its window or say when the one
          # it refused you reopens, so an hour is a guess that is long enough to
          # be worth waiting and short enough to be worth rechecking.
          COOLDOWN_MINUTES: "60"
        run: |
          set -euo pipefail
          gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --log-failed > failed.log || true
          if ! grep -Eqi '429|too many requests|rate.?limit' failed.log; then
            echo "the publish failed for some other reason, so there is no window to wait for"
            exit 0
          fi
          opens=$(date -u -d "+${COOLDOWN_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          title="Publishing ${GITHUB_REF_NAME} hit the index rate limit"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n' \
            "\`${GITHUB_REF_NAME}\` did not reach the index, which refused the upload as too many in too short a time. Nothing is lost and nothing is half published, so the fix is to wait and run the Release workflow again for the same tag." \
            "" \
            "retry-after: ${opens}" \
            "" \
            "The publish watch reads that time every hour and comments here when it has passed. The run that hit the limit is ${run_url}.")
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --label blocked --search "\"${title}\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body "Hit again by ${run_url}. The wait now runs to ${opens}."
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" \
              --label "blocked,release,packaging" --body "${body}"
          fi

  # Runs for every version tag, whether or not there were wheels, because the
  # release notes are the point of it and they exist either way.
  github-release:
    name: GitHub release
    needs: [build, pypi]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: needs.build.outputs.ready == 'true'
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The toolchain version is part of the release identity: the Mojo ABI is
          # not stable, so a binary built against one runtime is not guaranteed to
          # load against another. docs/specs/09-quality-bar.md section 8.
          #
          # The release usually exists already, written by hand, because generated
          # notes are a list of commit subjects and a reader wants to know what
          # changed and what it cost rather than what the branches were called. So
          # this attaches the artifacts to it and only writes notes itself if
          # nobody got there first.
          shopt -s nullglob
          files=(dist/*)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
            fi
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  # modular-community is a pull request against someone else's repository, so it is
  # slower than PyPI and is not gated on. The git install path stays documented.
  modular-community:
    name: Remind to publish to modular-community
    needs: [build, pypi]
    if: always() && needs.build.outputs.ready == 'true' && needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Publish ${GITHUB_REF_NAME} to modular-community" \
            --label "packaging,release" \
            --body "\`${GITHUB_REF_NAME}\` is on PyPI. Open the recipe pull request against \`modular/modular-community\` and link it here. Close when the package is resolvable via \`pixi add -c https://repo.prefix.dev/modular-community firepanda\`."
