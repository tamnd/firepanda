name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis of the workflows themselves. This is where unpinned actions,
  # over-broad permissions and injectable ${{ }} expressions get caught.
  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx zizmor --format sarif --persona regular . > zizmor.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # Only the thin __init__.py shim is Python, and CodeQL has no Mojo support, so
  # this covers a few hundred lines rather than the engine. It is cheap and the
  # shim is the piece an attacker reaches first through `import firepanda`.
  codeql:
    name: CodeQL (Python shim)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -d python/firepanda ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: github/codeql-action/init@v4
        if: steps.detect.outputs.run == 'true'
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        if: steps.detect.outputs.run == 'true'
