# Actions are pinned to release tags rather than commit SHAs while this repo has a
# single maintainer. That decision is recorded as a zizmor policy in
# `.github/zizmor.yml`, so it is one line to reverse when the project starts taking
# outside contributions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Until the first Mojo source lands, the build and test jobs have nothing to do.
  # They skip loudly rather than passing silently, and this job is what decides.
  guard:
    name: Detect sources
    runs-on: ubuntu-latest
    outputs:
      has_mojo: ${{ steps.detect.outputs.has_mojo }}
      has_python: ${{ steps.detect.outputs.has_python }}
      os_matrix: ${{ steps.matrix.outputs.os }}
      shards: ${{ steps.matrix.outputs.shards }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if compgen -G "firepanda/**/*.mojo" > /dev/null || compgen -G "firepanda/*.mojo" > /dev/null; then
            echo "has_mojo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mojo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Mojo sources::Repository is at specification stage; build and test jobs are skipped."
          fi
          if [ -d python/firepanda ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # Which platforms the build and test jobs run on. A pull request gets
      # Linux x86 and the merge gets all three.
      #
      # This is the same trade the mojo axis made below and it is made for the
      # same reason. Three platforms is three times the machines and none of
      # them is three times the information: in the history of this repository
      # no macOS or arm64 failure has ever arrived without the x86 job failing
      # alongside it, and the price was paid by whoever was waiting to merge.
      # Paying it on the merge instead costs a revert in the case where they do
      # diverge, and the case has not happened yet.
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","ubuntu-24.04-arm","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi
          # The shard count is written once and read twice, as the list the
          # matrix fans out over and as the number the runner is told to divide
          # the suite into. Those two used to be separate literals and they went
          # out of step the first time anybody edited one of them: the matrix
          # said four and the runner still said eight, so four jobs ran shards
          # one to four of eight, eighty six of the hundred and sixty two test
          # files were never run at all, and the whole thing went green.
          #
          # That failure cannot announce itself, because every shard that does
          # run passes and a shard is not told what the other shards were given.
          # So the count is derived here rather than repeated there.
          #
          # `awk` rather than `seq -s,` because BSD `seq` puts the separator
          # after the last number as well and GNU `seq` does not, and a trailing
          # comma is not JSON. This job runs on Linux today, which is exactly
          # the sort of thing that makes the other case a surprise later.
          count=8
          echo "shard_count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=[$(awk -v n="$count" 'BEGIN { for (i = 1; i <= n; i++) printf "%s%d", (i > 1 ? "," : ""), i }')]" >> "$GITHUB_OUTPUT"
        shell: bash

  spec:
    name: Spec checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The specification is the deliverable right now, so it is the thing under test.
      - name: No duration estimates in the spec
        run: |
          if grep -rnEi '[0-9]+ ?(week|month)s?|person.week' docs/specs; then
            echo "::error::docs/specs must not carry duration estimates; milestones are ordered, not scheduled."
            exit 1
          fi

      - name: Milestone tags resolve
        run: |
          # Every M<n> referenced in the parity checklist must be a heading in 08-milestones.md.
          # The optional letter suffix is for milestones inserted between two others, like M4b.
          grep -oE '^## M[0-9]+[a-z]?' docs/specs/08-milestones.md | awk '{print $2}' | sort -u > /tmp/defined
          grep -ohE '\(M[0-9]+[a-z]?\)' docs/specs/06-pandas-parity.md | tr -d '()' | sort -u > /tmp/used
          missing=$(comm -13 /tmp/defined /tmp/used)
          if [ -n "$missing" ]; then
            echo "::error::milestones referenced in 06-pandas-parity.md but not defined in 08-milestones.md: $missing"
            exit 1
          fi
          echo "milestones defined: $(tr '\n' ' ' < /tmp/defined)"

      # Document 09 section 3 makes one file the substitute for a race detector.
      # The rule is only worth anything if something checks it, so this is that
      # something. A grep is enough because the rule is about where a declaration
      # is written, not about what it does.
      - name: Shared mutable state stays in one file
        run: |
          rc=0
          stray=$(grep -rln 'Atomic\[' firepanda --include='*.mojo' | grep -v '^firepanda/exec/morsel.mojo$' || true)
          if [ -n "$stray" ]; then
            echo "::error::Atomic outside firepanda/exec/morsel.mojo: $stray"
            rc=1
          fi
          # A module level var is a mutable global. Comptime aliases are not, and
          # neither is anything indented, which is a field or a local.
          globals=$(grep -rn '^var ' firepanda --include='*.mojo' || true)
          if [ -n "$globals" ]; then
            echo "::error::mutable global: $globals"
            rc=1
          fi
          exit $rc

      # `CHANGELOG.md` is merged with the union driver, which is what keeps two
      # branches from conflicting on every entry. The price is that when both
      # sides append at the same place, the blank line that used to separate the
      # last entry from the next heading belongs to one side's hunk and comes out
      # the other side of the merge attached to neither. The result renders as one
      # run-on paragraph with a hash in the middle of it. Nothing about that is
      # visible in a diff of the merge, which is why it kept landing.
      - name: The changelog has a blank line before every heading
        run: |
          bad=$(awk 'NR>1 && /^#/ && prev != "" { print NR ": " $0 } { prev = $0 }' CHANGELOG.md)
          if [ -n "$bad" ]; then
            echo "::error::CHANGELOG.md heading with no blank line before it, which is the union merge eating one:"
            echo "$bad"
            exit 1
          fi

      # `firepanda/version.mojo` says itself that three copies of one string can
      # drift, and then they did, twice running. 0.8.18 moved `pixi.toml` and left
      # the other two on 0.8.17, and 0.8.19 moved `pixi.toml` again and left them
      # there, so `firepanda.version()` reported two releases behind the one it
      # was built from and a wheel would have carried the same wrong number.
      # Nothing in the build derives any of them from the tag, so this is what
      # notices.
      - name: The three version strings agree
        run: |
          pixi_v=$(grep -m1 '^version = ' pixi.toml | cut -d'"' -f2)
          py_v=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          mojo_v=$(grep -m1 '^comptime VERSION = ' firepanda/version.mojo | cut -d'"' -f2)
          echo "pixi.toml $pixi_v, pyproject.toml $py_v, version.mojo $mojo_v"
          if [ "$pixi_v" != "$py_v" ] || [ "$pixi_v" != "$mojo_v" ]; then
            echo "::error::version strings disagree: pixi.toml $pixi_v, pyproject.toml $py_v, firepanda/version.mojo $mojo_v"
            exit 1
          fi

      - name: Internal document cross-references resolve
        run: |
          rc=0
          while read -r n; do
            compgen -G "docs/specs/${n}-*.md" > /dev/null || { echo "::error::reference to document $n but no such file"; rc=1; }
          done < <(grep -ohE 'document [0-9]{2}' docs/specs/*.md | awk '{print $2}' | sort -u)
          # A subdirectory numbers its own documents, so a reference inside it
          # resolves against that directory rather than against the top level.
          for dir in docs/specs/*/; do
            compgen -G "${dir}*.md" > /dev/null || continue
            while read -r n; do
              compgen -G "${dir}${n}-*.md" > /dev/null || { echo "::error::reference in ${dir} to document $n but no such file"; rc=1; }
            done < <(grep -ohE 'document [0-9]{2}' "${dir}"*.md | awk '{print $2}' | sort -u)
          done
          exit $rc

      # Relative links only. A link check that talks to the internet is a flaky
      # check, and the retries and the widened accept list below were two rounds
      # of trying to make it not one: contributor-covenant.org reset a single
      # connection, mojolang.org redirected to itself with a trailing slash, and
      # then koaning.io failed a TLS handshake three times running and took a
      # comment-only pull request down with it.
      #
      # Retrying does not help, because none of those is transient in the way a
      # retry fixes. The thing they have in common is that they are facts about
      # somebody else's web server and a pull request cannot change any of them.
      # What a pull request can break is a relative link, by moving or renaming a
      # document, and `--offline` checks exactly those and nothing else. It also
      # runs in under a second rather than fifty.
      #
      # The external half still matters, because a page really can go away, so it
      # moved to the nightly soak run where nothing is waiting on it. That is the
      # same trade the fuzzers, the macOS shards and the microbenchmarks got.
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline './**/*.md'
          fail: true

  format:
    name: Format
    needs: guard
    if: needs.guard.outputs.has_mojo == 'true' || needs.guard.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pixi
      - name: mojo format
        if: needs.guard.outputs.has_mojo == 'true'
        run: pixi run format-check

      # The regular expression compiler holds version numbers for the rules
      # CPython's `re` has changed inside the range of interpreters this project
      # supports, and a constant like that fails quietly: when a new release
      # moves a rule, nothing raises, the library keeps answering with the rules
      # it was last told about. So the next release has to be a red light on
      # purpose. This step is it, and it lives in this job rather than in the
      # spec one because the question is about the interpreter a run is standing
      # in rather than about a file. Documents 90 and 91 both end by naming it.
      - name: Version rules match the interpreter
        if: needs.guard.outputs.has_mojo == 'true'
        run: pixi run python-version

      - uses: astral-sh/setup-uv@v7
        if: needs.guard.outputs.has_python == 'true'
      - name: ruff
        if: needs.guard.outputs.has_python == 'true'
        run: uvx ruff check python/ && uvx ruff format --check python/

      # The generated files are checked in, because a wheel has to build without
      # a Mojo toolchain deciding what is in it and because a diff on them is the
      # clearest review of a binding change there is. Checking them in means they
      # can go stale, and this is the step that says so. The same check runs as a
      # test, but it is worth failing here too: this job takes half a minute and
      # the one that runs the tests takes a good deal longer.
      - name: Generated bindings are current
        if: needs.guard.outputs.has_python == 'true'
        run: uv run --no-project python tools/bindings.py --check

      # mypy in strict mode, over the package only. The generated Python layer is
      # the whole point: it is written by a script that cannot itself be type
      # checked usefully, so the check that matters is on what comes out of it.
      - name: mypy
        if: needs.guard.outputs.has_python == 'true'
        run: uvx mypy

  build:
    name: Tests (${{ matrix.os }}, shard ${{ matrix.shard }} of ${{ needs.guard.outputs.shard_count }})
    needs: guard
    if: needs.guard.outputs.has_mojo == 'true'
    runs-on: ${{ matrix.os }}
    # A stabilizing language will break us, and finding out on the day it lands
    # rather than on release day is what `.github/workflows/nightly.yml` is for.
    # It builds and tests against nightly every morning and opens a tracking issue
    # when it breaks. Running the same build again on every pull request was the
    # slowest job in this workflow and told us nothing the canary had not already
    # told us that morning.
    #
    # The shards are four machines running a quarter of the test files each.
    # This step was thirty nine minutes of a fifty one minute job and it does not
    # get faster on one machine: Mojo 1.0 has no `mojo test`, so each test file
    # is its own program that compiles the library again, and almost all of that
    # wall clock is the compiler rather than the assertions. On the workstation
    # `tests/test_sql_run.mojo` takes 195 seconds against a cold compiler cache
    # and runs its 422 assertions in 22 of them.
    #
    # What does not help is handing the test files a precompiled package. The
    # generics are instantiated into whichever program uses them, so
    # `mojo run -I build tests/test_sql_run.mojo` takes 206 seconds where
    # `mojo run -I .` against the sources takes 193. All 422 tests pass either
    # way, so the package is right and simply does not save anything. This job
    # used to precompile it first regardless, for between fifty seven and eighty
    # nine seconds a shard, and then compile every test file against the sources
    # anyway. That step is now in the budget job on one platform, which is the
    # only thing that ever wanted it.
    #
    # What does help is the compiler's own cache, which is a different thing and
    # was confused with that one for a while. It is restored below.
    #
    # Eight, and an attempt to make it four is why the count is now derived in
    # the guard job rather than written here. Both halves of that are worth
    # keeping, because the reasoning that said four was wrong in a way that
    # looked like measurement.
    #
    # The claim was that a shard cannot finish before its longest file does,
    # that the file is tests/test_sql_run.mojo, and so the slowest shard is that
    # one file plus overhead at any count from three to eight. The first two are
    # true. The third is only true once there are enough shards for everything
    # else to spread out underneath it, and eight is roughly where that happens:
    #
    #   shards   slowest shard   runner seconds
    #        8             628             3814
    #        6             628             3366
    #        5             643             3205
    #        4             794             3164
    #        3            1043             3127
    #
    # So eight is already sitting on the floor, 596 seconds for that one file
    # plus 32 of job overhead, and four is a 26 per cent regression bought for a
    # 17 per cent saving in runner seconds. More shards than eight cannot help
    # either, for the same reason: the floor is one compile.
    #
    # What made four look free was the cost table. It was regenerated from a
    # green run, which sounds like the careful thing to do and is not, because
    # the per-file times a run reports are times with the compiler cache already
    # warm for the files that shard owns. The regenerated table came out at 5076
    # seconds against 12086 and the difference was read as the suite having got
    # faster. It had not. Against a cold run the old table lands within two per
    # cent and the regenerated one is out by a median factor of five and a
    # maximum of twenty. tools/test_costs_from_ci.sh says so at the top now.
    #
    # The one thing that survived all that is the queueing, which is real and is
    # not addressed here. The merge matrix is three platforms deep and macOS
    # runners are the scarce ones: on merge 001b7393 the macOS shards waited
    # 2359 seconds between them for a machine, the last of them taking 1067
    # seconds of which 699 was the wait. That is worth fixing and fewer shards
    # is not the way to fix it, since fewer shards each wait just as long and
    # then take longer to run.
    #
    # The way to make this faster is to make that one file cheaper, which is the
    # generic instantiation work in #979, or to split it. Nothing about the
    # shard count moves it.
    #
    # tools/run_tests.sh splits the list on the measured times in
    # tools/test_costs.txt, largest first into whichever shard has least so far.
    # Two earlier versions of that table got it wrong in instructive ways. The
    # first balanced on file size, on the reasoning that compile time tracks how
    # much code there is, and the shards came out between 249 and 662 seconds: a
    # file's cost is how much of the library it imports and instantiates rather
    # than how long it is. The second measured real times on a sixteen core
    # workstation, which balanced that machine to within half a per cent and this
    # one to 423 against 622 seconds. The table now comes off a runner, which is
    # what tools/test_costs_from_ci.sh is for.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.guard.outputs.os_matrix) }}
        shard: ${{ fromJSON(needs.guard.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      # One compiler cache entry per shard, because a shard compiles its own
      # eighth of the test files and sharing one entry between all eight would
      # mean each of them carrying the other seven eighths around for nothing.
      - uses: ./.github/actions/setup-pixi
        with:
          cache-slot: shard${{ matrix.shard }}

      - name: Toolchain versions
        run: pixi run mojo --version

      - name: Unit and docstring tests
        env:
          FIREPANDA_TEST_SHARDS: ${{ needs.guard.outputs.shard_count }}
          FIREPANDA_TEST_SHARD: ${{ matrix.shard }}
        run: pixi run test

  # The extension, once per platform rather than once per shard.
  extension:
    name: Extension (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.has_mojo == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.guard.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pixi
        with:
          cache-slot: extension

      # The extension, and the claim that it carries everything it needs. The
      # claim was first measured by hand on one laptop, and the ways it stops
      # being true are all quiet, so it is checked here on every platform we ship
      # for. docs/specs/12-the-python-front-door-measured.md section 2.
      - name: patchelf
        if: needs.guard.outputs.has_python == 'true' && runner.os == 'Linux'
        run: sudo apt-get install -y patchelf

      - name: Build the extension
        if: needs.guard.outputs.has_python == 'true'
        run: pixi run build-extension

      - uses: astral-sh/setup-uv@v7
        if: needs.guard.outputs.has_python == 'true'

      # `--no-project` on purpose. The tests here run a child interpreter with the
      # environment stripped out of it, and the interpreter they run is this one,
      # so it should be a plain CPython with pytest in it rather than anything
      # that has firepanda installed and could be answering the import from
      # somewhere other than the directory under test.
      # pandas is here because one of these tests compares our signatures against
      # it. That test is the only mechanical measurement of the compatibility
      # goal in the repository, and without pandas installed it skips silently,
      # which is the same as not having written it.
      # pyarrow and polars are here for the same reason. The Arrow protocol tests
      # are a claim about other people's code and they are worth nothing if the
      # other people's code is not installed to disagree.
      # duckdb is here because reading a firepanda frame with no copy is one of
      # M3's exit criteria, and DuckDB is the consumer that accepts nothing but
      # the stream protocol, so it is the one that says whether the stream export
      # is actually conforming rather than merely self consistent.
      # The interpreter is pinned because `uv run` otherwise takes the newest one
      # it can find, and the newest one is now a free threaded build. Importing
      # the extension into a free threaded interpreter segfaults inside
      # `PyInit__firepanda` before any test runs, on every platform at once,
      # which is what it did here. A C extension that does not declare whether it
      # is safe without the GIL is supposed to make Python turn the GIL back on
      # and carry on, so this is a defect rather than a thing we have not opted
      # into yet, and #400 tracks it. Until that is answered the version this is
      # known to work on is the version it runs on.
      - name: Extension tests
        if: needs.guard.outputs.has_python == 'true'
        run: >
          uv run --no-project --python 3.13 --with pytest --with pandas
          --with pyarrow --with polars --with duckdb python -m pytest
          python/tests -q


  # The two remaining pieces of the old build job. They are a separate job from
  # the extension rather than two more steps in it because they need nothing the
  # extension produces, and running them after it made the job the longest one
  # left in the pipeline for no reason but the order they happened to be written
  # in.
  budget:
    name: Stress & compile budget (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.has_mojo == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.guard.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pixi
        with:
          cache-slot: budget

      # The only place left that runs it, and one platform is enough. `pixi run
      # build` precompiles the library into a package for Mojo callers outside
      # this repository, and nothing inside it reads the result: the tests
      # compile against the sources, the extension builds against the sources,
      # and the comment in the test job says why the package would be slower to
      # hand them anyway. So it was thirty jobs a run paying between fifty seven
      # and eighty nine seconds for an artefact none of them opened, which in
      # shards six and seven was longer than the tests that followed it.
      #
      # It stays here once because a break in `mojo precompile` is a real break
      # for whoever consumes the package, and with the step gone everywhere else
      # nothing else in the pipeline would say so.
      - name: The package still precompiles
        if: matrix.os == 'ubuntu-latest'
        run: pixi run build

      - name: Concurrency stress
        run: pixi run stress

      # Under the monomorphization strategy in docs/specs/03-dtype-dispatch.md these
      # are the numbers most likely to blow up. Graph them from the first commit.
      - name: Compile budget
        run: pixi run compile-budget --output compile-budget.json

      - uses: actions/upload-artifact@v7
        with:
          name: compile-budget-${{ matrix.os }}
          path: compile-budget.json
          if-no-files-found: warn

  # One machine, always the same one, and both sides of the comparison measured
  # on it back to back, because comparing two runs on two runners measures the
  # runners. docs/specs/10-benchmarks.md.
  bench:
    name: Microbenchmarks
    needs: guard
    # Not on pull requests. The baseline step below already stood itself down
    # there, so what was left was nine and a half minutes of measuring with
    # nothing to compare the measurement against: the comparison step is
    # conditional on the baseline step, so on a pull request this job ran the
    # whole suite and uploaded an artifact that nobody opens. The gate that
    # means something on a pull request is the reference machine run recorded in
    # it by hand, which is written down three comments below and has not changed.
    if: needs.guard.outputs.has_mojo == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Two commits, because the baseline below is the previous commit rather than
      # an artifact from another run. The checkout's credentials are not kept;
      # this job only ever reads.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          cache-slot: bench

      # Tighter settings than a developer would use, all three of them measured
      # rather than picked. `--max-time` is what the suite's runtime is actually
      # made of: the harness keeps sampling until that bound rather than stopping
      # at the minimum, so the total is roughly the bound times 123 benchmarks
      # times the repetitions, and the row count barely enters into it. Halving
      # the rows moved a full run from 310 s to 276 s. These settings move it from
      # 316 s to 80 s while keeping five repetitions, and the measured spread
      # hardly notices: median interquartile range 13.7% against 12.1%, and the
      # ninetieth percentile identical at 50%. On a shared runner the noise floor
      # is the machine, not the sampling budget.
      - name: Run
        run: pixi run bench -- --json=bench.json --label=gha-ubuntu-latest --repetitions=5 --min-time=20 --max-time=40

      - uses: actions/upload-artifact@v7
        with:
          name: bench-ubuntu-latest
          path: bench.json
          if-no-files-found: error

      # The baseline is measured here, in this job, on this runner, rather than
      # downloaded from the last green run on main. Those runs land on whatever
      # hardware the pool had that day, and the spread between runner generations
      # is larger than any regression this gate is looking for. Comparing across
      # them reported a 91% regression in a file the pull request had not touched,
      # twice, with identical numbers both times, which is what a stale baseline
      # looks like rather than what noise looks like. Measuring both sides back to
      # back is the only version of this that means anything.
      #
      # It runs on pushes to main rather than on pull requests. Measuring both
      # sides doubles the job, and doubling it was buying a comparison that the
      # `--advisory` flag below already says nobody should gate on, in front of an
      # author who is waiting to merge. The performance gate with teeth is the
      # reference machine run recorded in each pull request. This one now lands a
      # few minutes after the merge, where nothing is waiting for it, and it is
      # one line to move back.
      - name: Measure the previous commit
        id: baseline
        if: github.event_name == 'push'
        run: |
          head=$(git rev-parse HEAD)
          parent=$(git rev-parse 'HEAD^') || exit 0
          git checkout --detach "$parent"
          mkdir -p baseline
          pixi run bench -- --json=baseline/bench.json --label=gha-previous \
            --repetitions=5 --min-time=20 --max-time=40
          git checkout --detach "$head"
          echo "found=true" >> "$GITHUB_OUTPUT"

      # The threshold is looser here than the tool's own default because a shared
      # runner is a noisy machine and a gate that cries wolf gets switched off.
      # The tool also refuses to call anything a regression unless it clears the
      # spread it measured, so this is two conditions rather than one.
      #
      # `--advisory` prints the table and the verdicts and then exits zero. The
      # reason is in the tool's module docstring and it is worth reading before
      # taking it out: benchmarks/main.mojo is one compilation unit, so a pull
      # request that appends benchmarks changes which of the loops above them get
      # vectorized, and the comparison then reports large reproducible movements
      # in files the pull request never opened. The performance gate with teeth is
      # the reference machine run recorded in each pull request.
      - name: Compare against the previous commit
        if: steps.baseline.outputs.found == 'true'
        run: |
          pixi run bench-compare -- --baseline baseline/bench.json --candidate bench.json \
            --threshold 0.25 --reference 'hash/dict_*' --advisory \
            --markdown "$GITHUB_STEP_SUMMARY"

  grammar:
    name: Vendored grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pixi
        with:
          cache-slot: grammar

      # The vendored grammar is DuckDB's, byte for byte, and the moment a local
      # edit exists "compatible by construction" becomes "compatible except for
      # the edits" and nobody will remember what they were. VENDOR carries a
      # SHA-256 per file so an edit is caught here rather than argued about
      # later. docs/specs/sql/03-the-grammar.md section 3.
      - name: Vendored grammar is unmodified
        working-directory: firepanda/sql/grammar
        run: |
          grep -E '^[0-9a-f]{64}  ' VENDOR > /tmp/grammar.sha256
          count=$(wc -l < /tmp/grammar.sha256)
          if [ "$count" -lt 40 ]; then
            echo "::error::VENDOR lists only $count files, which cannot be right"
            exit 1
          fi
          sha256sum --check --strict /tmp/grammar.sha256

      # The generated tables are checked in so that a contributor with no Python
      # and no network can build firepanda. That means they can go stale, and
      # this is the step that says so.
      - name: Generated grammar tables are current
        run: pixi run check-grammar

  differential:
    name: Differential vs pandas & DuckDB
    needs: guard
    if: needs.guard.outputs.has_mojo == 'true'
    runs-on: ubuntu-latest
    # This job takes about a minute on a warm cache and about four on a cold one.
    # It has wedged instead of exiting more than once, the worst of them for 37
    # minutes until somebody cancelled it by hand, so it gets a ceiling. The
    # number is high enough that a slow runner and a cold cache together stay well
    # under it, and low enough that a hang costs a coffee rather than an afternoon.
    #
    # Every step that runs a comparison gets its own ceiling as well, because the
    # job ceiling only says the job hung and a step ceiling says which comparison
    # did. A wedge at exit holds the process open with nothing left to print, so
    # without these the log stops at the last line of a report that finished and
    # there is nothing to tell it apart from a genuinely slow run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pixi
        with:
          environment: differential
          cache-slot: core
      # Mojo imports pandas in-process, so this needs no bindings and works from M1.
      # This one builds every differential program this job runs before it runs
      # the first, so it carries the compile time for all the steps below it.
      # The ceiling is fifteen rather than eight because the number of programs
      # grows with the comparison and ten of them is already past what eight
      # minutes covered. tools/build_differential.sh builds four at a time, which
      # is what the runner has cores for, so the compile is about two rounds.
      #
      # Six programs rather than eleven. The five regular expression comparisons
      # have their own job further down, which runs on the merge rather than
      # here, so building them here was about half of this step and bought this
      # pipeline nothing. `pixi run differential-regex` and its siblings build
      # their own group.
      - run: pixi run differential
        timeout-minutes: 15

      # The function catalog is read off a live DuckDB, so it belongs in the one
      # job that has DuckDB installed. It is checked in for the same reason the
      # grammar tables are, and it goes stale the same way: a DuckDB bump that
      # changes a signature changes what firepanda binds.
      - name: Generated function table is current
        run: pixi run check-functions
        timeout-minutes: 2

      # The cast costs are measured off the same DuckDB and go stale in a worse
      # way than the catalog does. A release that makes one more cast implicit
      # changes which overload a call binds to without changing any signature,
      # so the diff this step fails on is the only warning there would be.
      - name: Generated cast table is current
        run: pixi run check-casts
        timeout-minutes: 2

      # DuckDB's test corpus is 33 MB and is fetched rather than vendored, so it
      # is cached on the commit the grammar is pinned to. A grammar bump changes
      # the key and the next run fetches the corpus that belongs to it.
      - name: Read the pinned grammar commit
        id: grammar
        run: echo "sha=$(awk '/^commit:/ {print $2}' firepanda/sql/grammar/VENDOR)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .cache/duckdb-corpus
          key: duckdb-corpus-${{ steps.grammar.outputs.sha }}

      - name: Every statement in DuckDB's corpus, through both parsers
        run: pixi run differential-sql
        timeout-minutes: 5

      # The same comparison over statements the grammar wrote rather than ones
      # people wrote, which is how the rules the corpus has no test for get
      # covered at all. It needs no corpus, so it does not depend on the cache
      # above. docs/specs/sql/11-conformance.md section 4.
      - name: Statements out of the grammar, through both parsers
        run: pixi run differential-sql-generated
        timeout-minutes: 5

      # The two steps above ask whether a statement parses. This one asks what
      # an expression's type comes out as, which is the question a wrong answer
      # with no error attached comes from. It needs no corpus either.
      # docs/specs/sql/11-conformance.md section 5.
      - name: Expression types, through both binders
        run: pixi run differential-semantics
        timeout-minutes: 5

      # And the question after that one. A type comparison cannot see a kernel
      # that counts the right thing wrongly, which is how `strlen` shipped
      # counting characters where DuckDB counts bytes with every test above it
      # agreeing. docs/specs/sql/11-conformance.md section 6.
      # Fifteen rather than the five the steps above take. Almost all of it is
      # DuckDB, which is asked one query per expression, and the run has been
      # seen to take eleven minutes on a loaded machine and three on a quiet one.
      - name: Expression values, through both engines
        run: pixi run differential-answers
        timeout-minutes: 15

      # Every step above asks about one expression. A join that drops a row, a
      # group that keys on the wrong column and a sort that is not stable all go
      # through them untouched, and this is the one that asks whole queries.
      # Scale 0.01 here, which is three megabytes and a few seconds; the S4 exit
      # criterion is scale 1 and is run by hand.
      # docs/specs/sql/11-conformance.md section 7.
      - name: TPC-H answers, through both engines
        run: pixi run tpch
        timeout-minutes: 10

  # The five regular expression comparisons, which until now no workflow has
  # ever run. They were written alongside documents 76 and 79 through 81, they
  # were built on every pull request because the build script built everything,
  # and then nothing invoked them. That is the worst of both: the pull request
  # paid for the compile and nobody got the answer.
  #
  # It is not a hypothetical gap. #936 taught the pattern parser to read a
  # superset of Python's grammar and did not tell `firepanda/kernel/regex/route.mojo`,
  # so for three weeks firepanda sent 3402 patterns of a 30070 pattern corpus to
  # the engine pandas would not have sent them to. Every one of these five would
  # have caught it on the merge that introduced it. It reached main instead and
  # was found by a test file going red on an unrelated pull request.
  #
  # On merge rather than on pull requests, the same gate the microbenchmarks and
  # the other platforms use. These compare against pandas and RE2 rather than
  # against a fixture, so what they fail on is a disagreement with somebody
  # else's release as often as it is a change in this repository, and that is
  # not a thing to hold a merge on. A few minutes after the merge is soon enough
  # to catch a routing change on the commit that made it, which is the whole
  # point, and it costs the pull request pipeline nothing.
  differential-regex:
    name: Differential vs Python's re & RE2
    needs: guard
    if: needs.guard.outputs.has_mojo == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The same reasoning as the job above: a ceiling on the job says it hung and
    # a ceiling on each step says which comparison did.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environment: differential
          cache-slot: regex

      # Builds all six programs at four at a time, so about two rounds, and the
      # five steps below then pay nothing. This is the compile that used to sit
      # in the pull request pipeline.
      - name: Build
        run: pixi run differential-build-regex
        timeout-minutes: 15

      # Which engine answers. pandas parses every pattern with Python's parser
      # and routes on what comes back, so a front end that reads one pattern
      # differently sends it to the other engine and quietly answers a different
      # question. Document 76 section 6.
      - name: Routing, against pandas' own predicate
        run: pixi run differential-regex
        timeout-minutes: 10

      # What the engine then answers, which routing agreement says nothing
      # about. Document 77 section 7.
      - name: Matching, against str.contains
        run: pixi run differential-regex-match
        timeout-minutes: 10

      # Counting is a loop that belongs to Arrow rather than to either engine,
      # and follows three rules a reader would not guess. Document 79 section 7.
      - name: Counting, against str.count
        run: pixi run differential-regex-count
        timeout-minutes: 10

      # Replacing is a third loop, and not the one that counts: characters
      # rather than bytes, and it asks where each group matched. Document 80
      # section 7.
      - name: Replacing, against str.replace
        run: pixi run differential-regex-replace
        timeout-minutes: 10

      # The other alphabet. Three of the accessor's methods never reach Arrow,
      # so `\w` covers 63 characters for one half of it and 138558 for the
      # other. Document 81 section 7.
      - name: Extraction, against str.findall
        run: pixi run differential-regex-python
        timeout-minutes: 10

      # The question underneath all five, which is whether RE2 reads the pattern
      # at all. For two patterns in three the whole of what a caller gets back
      # is a refusal, so agreeing about the refusal is most of the work.
      - name: Refusals, against the RE2 Arrow is built with
        run: pixi run differential-regex-re2
        timeout-minutes: 10

  # The compiler cache from #959 is keyed on the commit and restored by prefix,
  # so every merge writes about twenty new entries and the ones they replace are
  # never read again. Nothing deleted them, and the repository's allowance is ten
  # gigabytes, so they piled up until GitHub started evicting to make room.
  #
  # What it evicts is the least recently used entry, which is not the same as the
  # useless one. The entries this deletes are useless by construction and the
  # ones eviction reaches for are whichever platform has been quiet for a day, so
  # an allowance spent on superseded entries is paid for by some shard going
  # cold on the next run. That is worth between three and nine times on a test
  # file, measured in .github/actions/setup-pixi/action.yml.
  #
  # It was found at 10.85 GB against the 10 GB allowance, with 3.59 of that in
  # entries that had already been replaced.
  #
  # The rule is one entry per key family, the newest, where a family is the key
  # with the trailing commit sha taken off and the ref it belongs to left on. A
  # job restoring by prefix takes the newest match anyway, so the rest can only
  # ever occupy space. Keys with no sha on the end are their own family, which
  # keeps this from collapsing two unrelated entries that happen to share a name
  # across refs.
  #
  # It lives here rather than in a workflow of its own because the moment worth
  # pruning at is the moment the writing finished, and a job that needs the
  # writers gets that for free. A workflow keyed on `workflow_run` would get the
  # same timing and hand a write token to a trigger that does not need one.
  prune:
    name: Prune superseded caches
    # Only on a merge, because a pull request's caches are still being restored
    # from while it is open, and after the writers so their post-job saves are
    # already in and get counted. `always()` so a red run still prunes: the
    # entries it wrote are just as superseded either way.
    if: always() && github.event_name == 'push'
    needs: [build, extension, budget, bench, differential, differential-regex]
    runs-on: ubuntu-latest
    permissions:
      # Listing and deleting caches is the Actions API rather than the contents
      # API, and deleting needs write. This is the only job in the repository
      # that asks for it.
      actions: write
    steps:
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list -R "$REPO" --limit 100 \
            --json id,key,ref,sizeInBytes,createdAt > caches.json
          python3 - <<'PY' > to_delete.txt
          import json, re, sys
          entries = json.load(open("caches.json"))
          entries.sort(key=lambda e: e["createdAt"], reverse=True)
          total = sum(e["sizeInBytes"] for e in entries)
          print(f"{len(entries)} entries, {total / 1e9:.2f} GB of the 10 GB allowance", file=sys.stderr)
          seen = set()
          for e in entries:
              # The compiler cache keys end in the commit that wrote them. Take
              # that off and everything before it names the thing being cached:
              # operating system, architecture, pixi environment and cache slot.
              stripped = re.sub(r"-[0-9a-f]{40}$", "", e["key"])
              family = (e["ref"], stripped)
              if family in seen:
                  print(f'{e["id"]}\t{e["sizeInBytes"]}\t{e["key"]}')
              else:
                  seen.add(family)
          PY
          if [ ! -s to_delete.txt ]; then
            echo "nothing superseded" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          freed=0
          while IFS=$'\t' read -r id size key; do
            if gh cache delete "$id" -R "$REPO" > /dev/null 2>&1; then
              freed=$((freed + size))
              echo "deleted $key"
            else
              # Not a failure. Another run of this, or GitHub's own eviction, can
              # take an entry between the list and the delete, and the outcome
              # either way is that it is gone.
              echo "already gone $key"
            fi
          done < to_delete.txt
          {
            echo "Deleted $(wc -l < to_delete.txt) superseded entries, $((freed / 1000000)) MB."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  required:
    name: CI
    if: always()
    needs: [spec, format, build, extension, budget, bench, grammar, differential, differential-regex]
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
